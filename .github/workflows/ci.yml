name: Auditoría científica y enlaces
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validación de módulos JavaScript
        run: npm test
      - name: Validar enlaces locales
        run: python tests/check_links.py
      - name: Preparar modelo Python
        run: python -m pip install numpy
      - name: Controles numéricos del modelo original
        run: python python/verificar.py
      - name: Preparar navegador para pruebas visuales
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Interacción y adaptación móvil
        run: python tests/browser_smoke.py
